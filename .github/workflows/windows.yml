name: Windows tests and build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/windows_ui_smoke.py
      - run: python -m PyInstaller --noconfirm TerTemiz.spec
      - run: python tests/windows_exe_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-screenshots
          path: test-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: TerTemiz-Windows
          path: |
            dist/TerTemiz/
            install.ps1
